<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <!-- 
        設定網頁編碼與視窗大小，確保在行動裝置上顯示正常
        Language: Traditional Chinese (zh-TW)
    -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Planner | 旅遊行程規劃</title>

    <!-- 引入 Tailwind CSS (樣式框架) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- 引入 FontAwesome (圖示庫) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- 
        Google Identity Services (GIS) Client Library
        這是新版的 Google Sign-In SDK，用於處理前端登入邏輯。
    -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- 自定義樣式 -->
    <style>
        /* 隱藏元素 Helper Class */
        .hidden {
            display: none !important;
        }

        /* Toast 通知動畫 */
        @keyframes slideIn {
            from {
                transform: translateY(100%);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
            }

            to {
                opacity: 0;
            }
        }

        /* Loading Spinner */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4f46e5;
            /* Indigo-600 */
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body class="bg-gray-50 min-h-screen text-gray-800 font-sans">

    <!-- === Global Loading Overlay (全域載入遮罩) === -->
    <!-- 當發送 API 請求時顯示，阻擋操作 -->
    <div id="global-loader" class="fixed inset-0 bg-white bg-opacity-75 z-50 flex items-center justify-center hidden">
        <div class="loader"></div>
    </div>

    <!-- === Navigation Bar (導航列) === -->
    <nav id="main-nav" class="bg-white shadow-sm fixed w-full z-10 hidden">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <!-- LOGO & Brand -->
                <div class="flex items-center cursor-pointer" onclick="App.router.navigate('dashboard')">
                    <i class="fas fa-plane-departure text-indigo-600 text-2xl mr-2"></i>
                    <span class="font-bold text-xl text-gray-900">Travel Planner</span>
                </div>

                <!-- Right Side Menu -->
                <div class="flex items-center space-x-4">
                    <!-- admin 連結 (僅管理員可見) -->
                    <a href="#" onclick="App.router.navigate('admin'); return false;" id="nav-admin-link"
                        class="text-gray-600 hover:text-indigo-600 px-3 py-2 rounded-md text-sm font-medium hidden">
                        <i class="fas fa-cog mr-1"></i>系統管理
                    </a>

                    <!-- 使用者資訊 -->
                    <div class="flex items-center space-x-2">
                        <img id="nav-user-avatar" src="" alt="Avatar" class="h-8 w-8 rounded-full">
                        <span id="nav-user-name" class="text-sm font-medium text-gray-700">User</span>
                    </div>

                    <!-- 登出按鈕 -->
                    <button id="btn-logout" class="text-gray-500 hover:text-red-600 ml-4">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- === Main Content Container (主要內容區) === -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-20 pb-10">

        <!-- 
            VIEW 1: Login Page (登入頁) 
            預設顯示，直到登入成功
        -->
        <div id="login-view" class="flex flex-col items-center justify-center min-h-[80vh]">
            <div class="text-center mb-8">
                <i class="fas fa-map-marked-alt text-6xl text-indigo-600 mb-4"></i>
                <h1 class="text-4xl font-bold text-gray-900 mb-2">開始您的旅程</h1>
                <p class="text-gray-600">輕鬆規劃，享受每一刻</p>
            </div>

            <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md text-center">
                <h2 class="text-2xl font-bold mb-6">登入系統</h2>

                <!-- Google Sign-In Button Container -->
                <!-- client_id 必須對應到 GCP Console 的設定 -->
                <div id="g_id_onload"
                    data-client_id="813216180870-88pi8mkt0qeijd8183ake8t3akjqkmmc.apps.googleusercontent.com"
                    data-callback="handleGoogleLogin" data-auto_prompt="false">
                </div>
                <div class="g_id_signin" data-type="standard" data-size="large" data-theme="outline"
                    data-text="sign_in_with" data-shape="rectangular" data-logo_alignment="left">
                </div>

                <p class="mt-4 text-xs text-gray-400">
                    登入即代表您同意我們的服務條款與隱私權政策。
                </p>
            </div>
        </div>

        <!-- 
            VIEW 2: Dashboard (儀表板 - 行程列表) 
        -->
        <div id="dashboard-view" class="hidden">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-gray-800">我的行程</h2>
                <button onclick="document.getElementById('create-trip-modal').classList.remove('hidden')"
                    class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg shadow transition flex items-center">
                    <i class="fas fa-plus mr-2"></i>建立新行程
                </button>
            </div>

            <!-- 行程卡片容器 -->
            <div id="trip-list-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- JavaScript 將動態插入內容 -->
            </div>
        </div>

        <!-- 
            VIEW 3: Admin Panel (系統管理) 
        -->
        <div id="admin-view" class="hidden">
            <div class="flex items-center mb-6">
                <button onclick="App.router.navigate('dashboard')" class="mr-4 text-gray-500 hover:text-gray-700">
                    <i class="fas fa-arrow-left"></i>
                </button>
                <h2 class="text-2xl font-bold text-gray-800">使用者管理</h2>
            </div>

            <div class="bg-white rounded-lg shadow overflow-hidden">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                使用者</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                Email</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                角色</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                狀態</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                操作</th>
                        </tr>
                    </thead>
                    <tbody id="user-table-body" class="bg-white divide-y divide-gray-200">
                        <!-- Admin.js renderUserTable 將動態插入內容 -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 
            VIEW 4: Trip Detail (行程詳情頁) 
        -->
        <div id="trip-detail-view" class="hidden">
            <!-- Header (BackButton, Title, Dates) -->
            <div class="flex items-center mb-6 border-b pb-4">
                <button onclick="App.router.navigate('dashboard')"
                    class="mr-4 text-gray-500 hover:text-indigo-600 transition">
                    <i class="fas fa-arrow-left text-xl"></i>
                </button>
                <div>
                    <h2 id="trip-detail-title" class="text-2xl font-bold text-gray-900">行程標題</h2>
                    <p id="trip-detail-dates" class="text-sm text-gray-500 mt-1">YYYY-MM-DD - YYYY-MM-DD</p>
                </div>
                <div class="ml-auto">
                    <!-- 未來可放置「編輯」、「刪除」等按鈕 -->
                    <button class="text-gray-400 hover:text-red-500" title="刪除行程" onclick="alert('尚未實作刪除功能')">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                </div>
            </div>

            <!-- Content Container -->
            <div id="trip-detail-content">
                <!-- Javascript will load content here -->
            </div>
        </div>

    </main>

    <!-- === Modal: Create Trip (建立行程彈窗) === -->
    <div id="create-trip-modal"
        class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center hidden">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-md p-6">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold">建立新行程</h3>
                <button onclick="document.getElementById('create-trip-modal').classList.add('hidden')"
                    class="text-gray-400 hover:text-gray-600">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <form id="create-trip-form">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">行程名稱</label>
                    <input type="text" id="new-trip-title" required
                        class="w-full border border-gray-300 rounded px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                        placeholder="例如：日本京阪神賞櫻五日遊">
                </div>

                <div class="flex gap-4 mb-4">
                    <div class="flex-1">
                        <label class="block text-sm font-medium text-gray-700 mb-1">開始日期</label>
                        <input type="date" id="new-trip-start-date" required
                            class="w-full border border-gray-300 rounded px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <div class="flex-1">
                        <label class="block text-sm font-medium text-gray-700 mb-1">結束日期</label>
                        <input type="date" id="new-trip-end-date" required
                            class="w-full border border-gray-300 rounded px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                </div>

                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-1">描述 (選填)</label>
                    <textarea id="new-trip-desc" rows="3"
                        class="w-full border border-gray-300 rounded px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                        placeholder="簡單描述這次的旅行..."></textarea>
                </div>

                <div class="flex justify-end gap-3">
                    <button type="button" onclick="document.getElementById('create-trip-modal').classList.add('hidden')"
                        class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded">取消</button>
                    <button type="submit"
                        class="px-4 py-2 bg-indigo-600 text-white rounded hover:bg-indigo-700">建立行程</button>
                </div>
            </form>
        </div>
    </div>

    <!-- === Modal: Edit Trip (編輯行程主檔) === -->
    <div id="edit-trip-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center hidden">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-md p-6">
            <h3 class="text-xl font-bold mb-4">編輯行程</h3>
            <form id="edit-trip-form">
                <input type="hidden" id="edit-trip-id">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">行程標題</label>
                    <input type="text" id="edit-trip-title" required
                        class="w-full border border-gray-300 rounded px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">開始日期</label>
                        <input type="date" id="edit-trip-start-date" required
                            class="w-full border border-gray-300 rounded px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">結束日期</label>
                        <input type="date" id="edit-trip-end-date" required
                            class="w-full border border-gray-300 rounded px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                </div>
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-1">描述</label>
                    <textarea id="edit-trip-desc" rows="3"
                        class="w-full border border-gray-300 rounded px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
                </div>
                <div class="flex justify-end gap-3">
                    <button type="button" onclick="document.getElementById('edit-trip-modal').classList.add('hidden')"
                        class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded">取消</button>
                    <button type="submit"
                        class="px-4 py-2 bg-indigo-600 text-white rounded hover:bg-indigo-700">儲存變更</button>
                </div>
            </form>
        </div>
    </div>

    <!-- === Modal: Add/Edit Trip Item (新增/編輯項目) === -->
    <div id="item-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center hidden">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-lg p-6 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h3 id="item-modal-title" class="text-lg font-bold">新增行程項目</h3>
                <button onclick="document.getElementById('item-modal').classList.add('hidden')"
                    class="text-gray-400 hover:text-gray-600">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <form id="add-item-form">
                <input type="hidden" id="item-id-hidden">

                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div class="col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-1">名稱 *</label>
                        <input type="text" id="item-name" required
                            class="w-full border border-gray-300 rounded px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                            placeholder="景點名稱、餐廳名...">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">類型</label>
                        <select id="item-type"
                            class="w-full border border-gray-300 rounded px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                            <option value="attraction">景點</option>
                            <option value="food">餐飲</option>
                            <option value="transport">交通</option>
                            <option value="hotel">住宿</option>
                            <option value="other">其他</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">花費 (預估)</label>
                        <input type="number" id="item-cost" min="0"
                            class="w-full border border-gray-300 rounded px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">地點</label>
                    <input type="text" id="item-location"
                        class="w-full border border-gray-300 rounded px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                        placeholder="地址或 Google Map 連結">
                </div>

                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">開始時間</label>
                        <input type="time" id="item-start-time"
                            class="w-full border border-gray-300 rounded px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">結束時間</label>
                        <input type="time" id="item-end-time"
                            class="w-full border border-gray-300 rounded px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                </div>

                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-1">備註</label>
                    <textarea id="item-notes" rows="3"
                        class="w-full border border-gray-300 rounded px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                        placeholder="訂位代號、注意事項..."></textarea>
                </div>

                <div class="flex justify-end gap-3">
                    <button type="button" onclick="document.getElementById('item-modal').classList.add('hidden')"
                        class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded">取消</button>
                    <button type="submit"
                        class="px-4 py-2 bg-indigo-600 text-white rounded hover:bg-indigo-700">儲存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- === Scripts (模組化載入) === -->
    <!-- 注意載入順序：Config -> Utils -> API -> 模組 -> App -->
    <!-- 使用 query string ?v=4 來避免瀏覽器快取舊檔案 -->
    <script src="js/config.js?v=4"></script>
    <script src="js/utils.js?v=4"></script>
    <script src="js/api.js?v=4"></script>
    <script src="js/auth.js?v=4"></script>
    <script src="js/admin.js?v=4"></script>
    <script src="js/trip.js?v=4"></script>
    <script src="js/trip-detail.js?v=4"></script>
    <script src="js/app.js?v=4"></script>

</body>

</html>
