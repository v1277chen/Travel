<!DOCTYPE html>
<html>

<head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>旅遊行程規劃 (Travel Planner)</title>
    <!-- 預載字型 (Preload Fonts) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* 
         * CSS 變數定義 (CSS Variables) 
         */
        :root {
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --secondary-color: #14b8a6;
            --bg-color: #f3f4f6;
            --surface-color: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --danger-color: #ef4444;
            --success-color: #10b981;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --radius-md: 0.5rem;
            --radius-lg: 0.75rem;
            --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* 佈局 (Layout) */
        .app-container {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .navbar {
            background-color: var(--surface-color);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-sm);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .nav-brand {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary-color);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-menu {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .main-content {
            flex: 1;
            padding: 2rem;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
        }

        /* 標題與文字 (Typography) */
        h1,
        h2,
        h3 {
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
        }

        h2 {
            font-size: 1.5rem;
            font-weight: 600;
        }

        p {
            color: var(--text-muted);
            margin-bottom: 1rem;
        }

        /* 元件 (Components) */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.5rem 1rem;
            border-radius: var(--radius-md);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
            text-decoration: none;
            font-size: 0.95rem;
            gap: 0.5rem;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
            box-shadow: 0 4px 6px rgba(99, 102, 241, 0.25);
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 8px rgba(99, 102, 241, 0.3);
        }

        .btn-secondary {
            background-color: white;
            border-color: var(--border-color);
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background-color: #f9fafb;
            border-color: #d1d5db;
        }

        .btn-danger {
            background-color: #fee2e2;
            color: var(--danger-color);
        }

        .btn-danger:hover {
            background-color: #fecaca;
        }

        .btn-success {
            background-color: #d1fae5;
            color: var(--success-color);
        }

        .btn-success:hover {
            background-color: #a7f3d0;
        }

        .btn-sm {
            padding: 0.25rem 0.5rem;
            font-size: 0.8rem;
        }

        .card {
            background-color: var(--surface-color);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        /* 表單 (Forms) */
        .form-group {
            margin-bottom: 1rem;
        }

        .form-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        .form-control {
            width: 100%;
            padding: 0.625rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            font-size: 1rem;
            transition: border-color 0.15s;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        /* 工具類 (Utilities) */
        .hidden {
            display: none !important;
        }

        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .mb-4 {
            margin-bottom: 1rem;
        }

        .grid-trips {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .text-center {
            text-align: center;
        }

        /* 載入中動畫 (Loading Spinner) */
        .spinner {
            width: 2rem;
            height: 2rem;
            border: 3px solid #e5e7eb;
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* 彈出視窗 (Modal) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-container {
            background: white;
            border-radius: var(--radius-lg);
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            transform: scale(0.95);
            transition: transform 0.2s;
        }

        .modal-overlay.active .modal-container {
            transform: scale(1);
        }

        .modal-header {
            padding: 1.25rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-body {
            padding: 1.25rem;
        }

        .modal-footer {
            padding: 1.25rem;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: flex-end;
            gap: 0.75rem;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-muted);
        }
    </style>
</head>

<body>
    <!-- 應用程式主容器 -->
    <div class="app-container">

        <!-- 導航列 (Navbar) -->
        <nav class="navbar">
            <a href="#" class="nav-brand">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path

                <button class="btn btn-secondary" onclick="navigateTo('dashboard')">我的行程</button>
                <div style="border-left:1px solid #ddd; margin:0 5px; height: 1.5rem;"></div>
                <span id="nav-user-name" style="font-weight:500; color: var(--primary-color);"></span>
                <button class="btn btn-secondary" onclick="logout()">登出</button>

        </nav>

        <!-- 主要內容區 (Main Content) -->
        <main class="main-content">

            <!-- Global Loader -->
            <div id="global-loader" class="spinner hidden"
                style="position:fixed; top:50%; left:50%; margin-top:-1rem; margin-left:-1rem; z-index:9999;"></div>

            <!-- 1. 登入畫面 (Login View) -->
            <section id="view-login" class="view-section hidden">
                <div style="max-width: 400px; margin: 4rem auto; text-align: center;">
                    <h2 class="mb-4">歡迎使用旅遊行程規劃系統</h2>
                    <p class="mb-4">請使用 Google 帳號登入以繼續</p>
                    <div id="g_id_onload"

                        data-callback="handleGoogleLogin" data-auto_prompt="false">
                    </div>
                    <div class="g_id_signin" data-type="standard" data-size="large" data-theme="outline"
                        data-text="sign_in_with" data-shape="rectangular" data-logo_alignment="left">
                    </div>
                </div>
            </section>

            <!-- 2. 行程儀表板 (Dashboard View) -->
            <section id="view-dashboard" class="view-section hidden">
                <div class="flex-between mb-4">
                    <h1>您的行程 (My Trips)</h1>
                    <button class="btn btn-primary" onclick="openCreateTripModal()">+ 建立新行程</button>
                </div>
                <div id="trip-list" class="grid-trips"></div>
            </section>

            <!-- 3. 管理員後台 (Admin View) -->
            <section id="view-admin" class="view-section hidden">
                <div class="flex-between mb-4">
                    <h1>系統管理後台</h1>
                    <button class="btn btn-secondary" onclick="navigateTo('dashboard')">返回前台</button>
                </div>
                <div id="admin-content">
                    <!-- JS Rendered Content -->
                </div>
            </section>

            <!-- 4. 行程詳情頁 (Trip Detail View) -->
            <section id="view-trip-detail" class="view-section hidden">
                <button class="btn btn-secondary mb-4" onclick="navigateTo('dashboard')">← 返回列表</button>
                <div id="detail-loading" class="spinner"></div>
                <div id="detail-content" class="hidden">
                    <div class="card mb-4"
                        style="background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-hover) 100%); color: white;">
                        <h2 id="d-title" style="color:white; margin-bottom: 0.5rem">行程標題</h2>
                        <p id="d-meta" style="color: rgba(255,255,255,0.8)">時間 - 说明</p>
                    </div>

                    <div class="flex-between mb-4">
                        <h3>詳細行程表</h3>
                        <button class="btn btn-primary" onclick="alert('功能開發中：請稍後...')">+ 新增活動</button>
                    </div>

                    <div id="itinerary-list"></div>
                </div>
            </section>

        </main>
    </div>

    <!-- Modals -->
    <div id="create-trip-modal" class="modal-overlay">
        <div class="modal-container">
            <div class="modal-header">
                <h3>建立新行程</h3>
                <button class="close-btn"
                    onclick="document.getElementById('create-trip-modal').classList.remove('active')">&times;</button>
            </div>
            <form onsubmit="handleCreateTrip(event)">
                <div class="modal-body">
                    <div class="form-group">
                        <label class="form-label">行程標題</label>
                        <input type="text" id="new-trip-title" class="form-control" required placeholder="例如：日本東京五日遊">
                    </div>
                    <div class="form-group">
                        <label class="form-label">描述</label>
                        <textarea id="new-trip-desc" class="form-control" rows="3"
                            placeholder="簡單描述這次的旅行亮點..."></textarea>
                    </div>
                    <div class="form-group">
                        <label class="form-label">開始日期</label>
                        <input type="date" id="new-trip-date" class="form-control" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary"
                        onclick="document.getElementById('create-trip-modal').classList.remove('active')">取消</button>
                    <button type="submit" class="btn btn-primary">確認建立</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Google Identity Services Script -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Modular JS -->
    <script src="js/config.js?v=2"></script>
    <script src="js/utils.js?v=2"></script>
    <script src="js/api.js?v=2"></script>
    <script src="js/auth.js?v=2"></script>
    <script src="js/admin.js?v=2"></script>
    <script src="js/app.js?v=2"></script>

</body>

</html>
